    repository: ZichaoLong/ObsidianVault; revision: 99d69c5;
    redraw date: 2026-10-28. No embedded raster images.</metadata>
  <rect x="-8" y="-8" width="360" height="430" fill="white"/>
  <g id="wires" fill="none" stroke="#222" stroke-width="1.8">
    <path d="M 171,66 V 106 L 92,173 L 29,274 V 335"/>
    <path d="M 171,106 L 250,173 L 171,274 V 335"/>
    <path d="M 250,173 L 314,274 V 335"/>
    <path d="M 29,300 L 171,335 M 171,300 L 314,335"/>
  </g>
  <g id="gates" font-family="DejaVu Sans, sans-serif" font-size="28" text-anchor="middle">
    <g id="output-and"><circle cx="171" cy="106" r="28" fill="white" stroke="#222" stroke-width="1.8"/><text x="171" y="115">∧</text></g>
    <g id="left-not"><circle cx="92" cy="173" r="28" fill="white" stroke="#222" stroke-width="1.8"/><text x="92" y="182">¬</text></g>
    <g id="right-or"><circle cx="250" cy="173" r="28" fill="white" stroke="#222" stroke-width="1.8"/><text x="250" y="182">∨</text></g>
    <g id="x1-x2-and"><circle cx="29" cy="274" r="28" fill="white" stroke="#222" stroke-width="1.8"/><text x="29" y="283">∧</text></g>
    <g id="x2-x3-and"><circle cx="171" cy="274" r="28" fill="white" stroke="#222" stroke-width="1.8"/><text x="171" y="283">∧</text></g>
    <g id="x3-not"><circle cx="314" cy="274" r="28" fill="white" stroke="#222" stroke-width="1.8"/><text x="314" y="283">¬</text></g>
  </g>
  <g id="values-and-labels" font-family="DejaVu Sans, sans-serif" font-size="17" text-anchor="middle" fill="#222">
