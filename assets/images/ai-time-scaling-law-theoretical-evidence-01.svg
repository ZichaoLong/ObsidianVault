<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="430" viewBox="-8 -8 360 430"
     role="img" aria-labelledby="title description">
  <title id="title">Boolean circuit</title>
  <desc id="description">依据 ai-time-scaling-law-theoretical-evidence-01.png 手工重画。
    保留六个逻辑门及连接；输入 (x1,x2,x3)=(0,1,0)，输出为 1。
    所示计算为 NOT(x1 AND x2) AND ((x2 AND x3) OR NOT(x3))。
    字体、线宽和坐标近似原图，供核对及编辑。</desc>
  <metadata>Source: assets/images/ai-time-scaling-law-theoretical-evidence-01.png;
