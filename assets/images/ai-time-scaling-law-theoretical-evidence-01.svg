    <text x="29" y="354">x1</text><text x="171" y="354">x2</text><text x="314" y="354">x3</text>
    <text x="29" y="376">0</text><text x="171" y="376">1</text><text x="314" y="376">0</text>
    <text x="171" y="404">inputs</text>
  </g>
