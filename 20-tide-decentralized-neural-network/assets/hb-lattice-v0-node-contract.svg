<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <style>
      .title { font: 700 34px "Noto Sans CJK SC", sans-serif; fill: #17232b; }
      .subtitle { font: 400 18px "Noto Sans CJK SC", sans-serif; fill: #55636b; }
      .lane { font: 700 19px "Noto Sans CJK SC", sans-serif; fill: #34454f; }
      .label { font: 600 17px "Noto Sans CJK SC", sans-serif; fill: #17232b; }
      .small { font: 400 14px "Noto Sans CJK SC", sans-serif; fill: #526068; }
      .tiny { font: 400 13px "Noto Sans CJK SC", sans-serif; fill: #526068; }
      .box { stroke-width: 2; rx: 14; ry: 14; }
      .npu { fill: #e6eef8; stroke: #426ea8; }
      .cpu { fill: #f2e6ca; stroke: #9a7720; }
      .state { fill: #e4f1df; stroke: #54864c; }
      .active { fill: #fae3cd; stroke: #c66d2c; }
      .inactive { fill: #efefeb; stroke: #8b969b; }
      .artifact { fill: #fffdf7; stroke: #b7aea1; }
      .npuLane { fill: #f0f5fb; stroke: #c0cfdf; stroke-width: 1.5; rx: 18; ry: 18; }
      .cpuLane { fill: #fbf5e9; stroke: #dccca8; stroke-width: 1.5; rx: 18; ry: 18; }
      .arrow { fill: none; stroke: #526a76; stroke-width: 3; }
      .yes { fill: none; stroke: #d26a22; stroke-width: 4; }
      .no { fill: none; stroke: #899398; stroke-width: 3; stroke-dasharray: 8 6; }
      .stateArrow { fill: none; stroke: #54864c; stroke-width: 3; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#526a76"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#d26a22"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#899398"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#54864c"/>
    </marker>
  </defs>

  <rect width="1600" height="760" fill="#f3efe5"/>
  <text x="65" y="60" class="title">Leaf/Cell 节点执行契约：收到即更新，激活才重计算与发送</text>
  <text x="65" y="94" class="subtitle">语义评分在昂贵计算前产生；CPU 只扫描紧凑分数与单序列负载状态。未激活分支可以真实跳过 Attention/FFN kernel。</text>

  <rect x="55" y="135" width="1490" height="305" class="npuLane"/>
  <text x="80" y="172" class="lane">Ascend / NPU：批量张量计算与状态存储</text>
  <rect x="55" y="465" width="1490" height="170" class="cpuLane"/>
  <text x="80" y="502" class="lane">CPU：严格 token 顺序的轻量 selector / allocator</text>

  <rect x="90" y="225" width="180" height="92" class="box npu"/>
  <text x="180" y="258" text-anchor="middle" class="label">Receive Inbox</text>
  <text x="180" y="283" text-anchor="middle" class="small">按 batch/node/time</text>
  <text x="180" y="304" text-anchor="middle" class="tiny">整理 ragged messages</text>

  <rect x="335" y="225" width="210" height="92" class="box state"/>
  <text x="440" y="255" text-anchor="middle" class="label">Update State</text>
  <text x="440" y="280" text-anchor="middle" class="small">K/V projection 或 SSM step</text>
  <text x="440" y="302" text-anchor="middle" class="tiny">与本节点是否激活无关</text>

  <rect x="610" y="225" width="190" height="92" class="box npu"/>
  <text x="705" y="255" text-anchor="middle" class="label">Cheap Score</text>
  <text x="705" y="280" text-anchor="middle" class="small">message/state probe</text>
  <text x="705" y="302" text-anchor="middle" class="tiny">不能依赖本次完整 Attention</text>

  <rect x="665" y="525" width="250" height="72" class="box cpu"/>
  <text x="790" y="553" text-anchor="middle" class="label">Hierarchical Selector</text>
  <text x="790" y="578" text-anchor="middle" class="small">semantic score + load state</text>

  <rect x="1000" y="215" width="235" height="112" class="box active"/>
  <text x="1117" y="247" text-anchor="middle" class="label">ActiveCompute</text>
  <text x="1117" y="272" text-anchor="middle" class="small">Q / packed Attention</text>
  <text x="1117" y="294" text-anchor="middle" class="small">FFN / SSM output / adapter</text>
  <text x="1117" y="316" text-anchor="middle" class="tiny">只对 route list 中的项执行</text>

  <rect x="1320" y="225" width="175" height="92" class="box active"/>
  <text x="1407" y="258" text-anchor="middle" class="label">Emit</text>
  <text x="1407" y="283" text-anchor="middle" class="small">向固定邻接后继</text>
  <text x="1407" y="304" text-anchor="middle" class="tiny">发送 delta/message</text>

  <rect x="1040" y="520" width="210" height="82" class="box inactive"/>
  <text x="1145" y="551" text-anchor="middle" class="label">Inactive</text>
  <text x="1145" y="576" text-anchor="middle" class="small">保留已更新状态</text>
  <text x="1145" y="596" text-anchor="middle" class="tiny">不运行重 kernel，不发送</text>

  <rect x="1305" y="510" width="205" height="102" class="box artifact"/>
  <text x="1407" y="541" text-anchor="middle" class="label">Artifacts</text>
  <text x="1407" y="565" text-anchor="middle" class="tiny">scores / candidates</text>
  <text x="1407" y="585" text-anchor="middle" class="tiny">mask / weights / load state</text>
  <text x="1407" y="605" text-anchor="middle" class="tiny">messages / commits</text>

  <path d="M270 271 L335 271" class="arrow" marker-end="url(#arrow)"/>
  <path d="M545 271 L610 271" class="arrow" marker-end="url(#arrow)"/>
  <path d="M705 317 C705 405, 735 465, 770 525" class="arrow" marker-end="url(#arrow)"/>
  <text x="675" y="425" class="tiny">compact score transfer</text>

  <path d="M915 550 C950 495, 1000 410, 1060 327" class="yes" marker-end="url(#arrowOrange)"/>
  <text x="956" y="437" class="label" fill="#b75a1d">active</text>
  <path d="M915 574 L1040 574" class="no" marker-end="url(#arrowGray)"/>
  <text x="960" y="565" class="tiny">inactive</text>

  <path d="M1235 271 L1320 271" class="yes" marker-end="url(#arrowOrange)"/>
  <path d="M440 317 C440 370, 470 405, 520 405 L1110 405 C1140 405, 1145 455, 1145 520" class="stateArrow" marker-end="url(#arrowGreen)"/>
  <text x="770" y="397" text-anchor="middle" class="small">状态提交发生在 selector 之前；inactive 也保留更新</text>
  <path d="M1407 317 L1407 510" class="arrow" marker-end="url(#arrow)"/>
  <path d="M1250 561 L1305 561" class="no" marker-end="url(#arrowGray)"/>

  <rect x="90" y="665" width="1420" height="60" class="box artifact"/>
  <text x="115" y="690" class="small">物理短路边界：UpdateState 与 Score 必须执行；ActiveCompute 与 Emit 可按 hard route 真正跳过。</text>
  <text x="115" y="713" class="small">若使用 soft selector，多个分支可被 packed 执行并按 weight 合并；若使用 hard selector，反向估计策略必须由 selector contract 明确声明。</text>
</svg>
