<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title { font: 700 34px "Noto Sans CJK SC", sans-serif; fill: #182a31; }
      .subtitle { font: 400 18px "Noto Sans CJK SC", sans-serif; fill: #52646c; }
      .laneTitle { font: 700 22px "Noto Sans CJK SC", sans-serif; fill: #22363e; }
      .boxTitle { font: 700 17px "Noto Sans CJK SC", sans-serif; fill: #20353d; }
      .label { font: 500 15px "Noto Sans CJK SC", sans-serif; fill: #334a52; }
      .small { font: 400 13px "Noto Sans CJK SC", sans-serif; fill: #5b6d73; }
      .laneGraph { fill: #fff7e7; stroke: #b77a21; stroke-width: 2; rx: 18; ry: 18; }
      .laneCheckpoint { fill: #eaf7f5; stroke: #277f83; stroke-width: 2; rx: 18; ry: 18; }
      .boxGraph { fill: #fffdf8; stroke: #c69342; stroke-width: 1.8; rx: 13; ry: 13; }
      .boxCheckpoint { fill: #fffdf8; stroke: #4a9999; stroke-width: 1.8; rx: 13; ry: 13; }
      .candidate { fill: #edf2e5; stroke: #647f3e; stroke-width: 2.5; rx: 20; ry: 20; }
      .outcome { fill: #fffdf8; stroke: #9c9282; stroke-width: 1.5; rx: 13; ry: 13; }
      .arrowGraph { fill: none; stroke: #b77a21; stroke-width: 3; }
      .arrowCheckpoint { fill: none; stroke: #277f83; stroke-width: 3; }
      .arrowCandidate { fill: none; stroke: #647f3e; stroke-width: 3; stroke-dasharray: 9 6; }
      .branch { fill: none; stroke: #647f3e; stroke-width: 3; }
      .branchNode { fill: #f9fbf5; stroke: #647f3e; stroke-width: 2; rx: 10; ry: 10; }
      .warning { fill: #f7eee8; stroke: #aa684c; stroke-width: 1.5; rx: 12; ry: 12; }
    </style>
    <marker id="arrowGraph" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#b77a21"/></marker>
    <marker id="arrowCheckpoint" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#277f83"/></marker>
    <marker id="arrowCandidate" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#647f3e"/></marker>
  </defs>

  <rect width="1600" height="900" fill="#f3efe6"/>
  <text x="64" y="58" class="title">Tide 两条战略路线：期待汇合，但不预设汇合</text>
  <text x="64" y="91" class="subtitle">上路线给出表达上限和设计约束；下路线提供 checkpoint、可训练基线和逐项实验。虚线表示研究假设，不表示已证明等价。</text>

  <rect x="55" y="135" width="935" height="250" class="laneGraph"/>
  <text x="82" y="174" class="laneTitle">Graph 收缩线</text>
  <text x="82" y="201" class="small">从一般机制出发，逐步删除无法证明、无法训练或无法高性能实现的自由度</text>

  <rect x="85" y="235" width="190" height="92" class="boxGraph"/>
  <text x="180" y="271" text-anchor="middle" class="boxTitle">一般 Graph / LH</text>
  <text x="180" y="298" text-anchor="middle" class="small">机制池与复杂 reference</text>
  <rect x="350" y="235" width="190" height="92" class="boxGraph"/>
  <text x="445" y="271" text-anchor="middle" class="boxTitle">有限 Event DAG</text>
  <text x="445" y="298" text-anchor="middle" class="small">依赖、状态与提交显式</text>
  <rect x="615" y="235" width="190" height="92" class="boxGraph"/>
  <text x="710" y="271" text-anchor="middle" class="boxTitle">一般空间 DAG</text>
  <text x="710" y="298" text-anchor="middle" class="small">显式 allocator</text>
  <rect x="850" y="235" width="110" height="92" class="boxGraph"/>
  <text x="905" y="266" text-anchor="middle" class="boxTitle">HB-Sliced</text>
  <text x="905" y="292" text-anchor="middle" class="small">Lattice 正式化</text>
  <path d="M275 281 H337" class="arrowGraph" marker-end="url(#arrowGraph)"/>
  <path d="M540 281 H602" class="arrowGraph" marker-end="url(#arrowGraph)"/>
  <path d="M805 281 H837" class="arrowGraph" marker-end="url(#arrowGraph)"/>

  <rect x="55" y="445" width="935" height="250" class="laneCheckpoint"/>
  <text x="82" y="484" class="laneTitle">Checkpoint 生长线</text>
  <text x="82" y="511" class="small">从成熟模型出发，先保持函数，再逐步增加分支；后期允许形成不兼容的后代模型</text>

  <rect x="85" y="545" width="190" height="92" class="boxCheckpoint"/>
  <text x="180" y="581" text-anchor="middle" class="boxTitle">预训练模型</text>
  <text x="180" y="608" text-anchor="middle" class="small">Transformer / Mamba</text>
  <rect x="350" y="545" width="190" height="92" class="boxCheckpoint"/>
  <text x="445" y="581" text-anchor="middle" class="boxTitle">完全等价装载</text>
  <text x="445" y="608" text-anchor="middle" class="small">参数、logits、cache/state</text>
  <rect x="615" y="545" width="190" height="92" class="boxCheckpoint"/>
  <text x="710" y="581" text-anchor="middle" class="boxTitle">函数保持生长</text>
  <text x="710" y="608" text-anchor="middle" class="small">zero residual / clone-split</text>
  <rect x="850" y="545" width="110" height="92" class="boxCheckpoint"/>
  <text x="905" y="572" text-anchor="middle" class="boxTitle">平铺分支</text>
  <text x="905" y="596" text-anchor="middle" class="small">共享 selector</text>
  <text x="905" y="616" text-anchor="middle" class="small">固定 merge</text>
  <path d="M275 591 H337" class="arrowCheckpoint" marker-end="url(#arrowCheckpoint)"/>
  <path d="M540 591 H602" class="arrowCheckpoint" marker-end="url(#arrowCheckpoint)"/>
  <path d="M805 591 H837" class="arrowCheckpoint" marker-end="url(#arrowCheckpoint)"/>

  <rect x="1060" y="240" width="475" height="350" class="candidate"/>
  <text x="1298" y="280" text-anchor="middle" class="laneTitle">候选交界面：递归固定 merge 分支</text>
  <text x="1298" y="308" text-anchor="middle" class="small">有限深度、有界 fan-out、兄弟共享 selector、父模块唯一出口</text>

  <rect x="1090" y="375" width="110" height="58" class="branchNode"/>
  <text x="1145" y="410" text-anchor="middle" class="boxTitle">输入 x</text>
  <rect x="1242" y="335" width="130" height="58" class="branchNode"/>
  <text x="1307" y="370" text-anchor="middle" class="boxTitle">短分支</text>
  <rect x="1242" y="415" width="130" height="58" class="branchNode"/>
  <text x="1307" y="450" text-anchor="middle" class="boxTitle">长分支 1</text>
  <rect x="1242" y="495" width="130" height="58" class="branchNode"/>
  <text x="1307" y="530" text-anchor="middle" class="boxTitle">长分支 K</text>
  <rect x="1415" y="415" width="90" height="58" class="branchNode"/>
  <text x="1460" y="450" text-anchor="middle" class="boxTitle">Merge</text>
  <path d="M1200 404 C1220 404 1225 364 1242 364 M1200 404 H1242 M1200 404 C1220 404 1225 524 1242 524" class="branch"/>
  <path d="M1372 364 C1395 364 1392 444 1415 444 M1372 444 H1415 M1372 524 C1395 524 1392 444 1415 444" class="branch"/>

  <path d="M960 281 C1010 281 1010 350 1060 350" class="arrowCandidate" marker-end="url(#arrowCandidate)"/>
  <path d="M960 591 C1010 591 1010 510 1060 510" class="arrowCandidate" marker-end="url(#arrowCandidate)"/>

  <rect x="55" y="755" width="1480" height="100" class="warning"/>
  <text x="82" y="792" class="boxTitle">可能结果</text>
  <text x="82" y="823" class="label">完整结构汇合 ｜ 只共享契约和局部机制 ｜ 始终保持两类不同模型。任何一种结果都必须由证明、artifact equality 和训练实验决定。</text>
</svg>
