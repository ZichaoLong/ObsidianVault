name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check artifact tracking
        run: python3 tools/check_artifacts.py
      - name: Check repository-wide local links
        run: python3 tools/check_links.py
      - name: Check Tide documents
        run: python3 20-tide-decentralized-neural-network/tools/check_documents.py
      - name: Check topology, allocation and attention mathematics
        run: |
          python3 20-tide-decentralized-neural-network/examples/hb_lh_checks.py
          python3 20-tide-decentralized-neural-network/examples/hb_settle_checks.py
          python3 20-tide-decentralized-neural-network/examples/hb_compact_checks.py
          python3 20-tide-decentralized-neural-network/examples/backbone_capacity_checks.py
          python3 20-tide-decentralized-neural-network/examples/role_bounded_allocation_checks.py
          python3 20-tide-decentralized-neural-network/examples/incoming_attention_checks.py
          python3 20-tide-decentralized-neural-network/examples/regional_attention_checks.py
      - name: Test builds and native diagram export
        run: python3 -m unittest discover -s tools -p 'test_*.py'

  backbone-atlas:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest
      - name: Install native atlas rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 librsvg2-2 fonts-noto-cjk
          firefox --version
      - name: Check isolated renderer against a Fontconfig collision
        run: python3 -m unittest discover -s tools -p test_native_svg.py -v
      - name: Build the backbone atlas
        run: python3 tools/build.py --group backbone-atlas
      - name: Check backbone topology and capacity views in Firefox
        run: python3 20-tide-decentralized-neural-network/explorers/backbone-atlas/check_browser.py --output-dir "$RUNNER_TEMP/backbone-atlas-browser"
      - name: Require current atlas outputs and a clean checkout
        run: |
          python3 tools/check_artifacts.py --require-built --group backbone-atlas
          python3 tools/check_links.py
          git diff --exit-code
          python3 -c "import subprocess; assert not subprocess.check_output(['git', 'status', '--porcelain']), 'Atlas checks left untracked files'"
      - name: Preserve browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backbone-atlas-browser-diagnostics
          path: |
            ${{ runner.temp }}/backbone-atlas-browser/*.log
            ${{ runner.temp }}/backbone-atlas-browser/*.json
            ${{ runner.temp }}/backbone-atlas-browser/*.png
          if-no-files-found: ignore

  full-build:
    if: github.event_name == 'workflow_dispatch'
    needs: [checks, backbone-atlas]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 librsvg2-2 fonts-noto-cjk fonts-noto-cjk-extra fonts-dejavu-core fonts-dejavu-extra
          python3 -m pip install -r 20-tide-decentralized-neural-network/figures/requirements.txt
          npm install --global @playwright/cli@0.1.12
          google-chrome --version
      - name: Build figures, HTML and PDF
        run: python3 tools/build.py --full
      - name: Require all outputs and a clean checkout
        run: |
          python3 tools/check_artifacts.py --require-built
          python3 tools/check_links.py --require-built
          git diff --exit-code
          python3 -c "import subprocess; assert not subprocess.check_output(['git', 'status', '--porcelain']), 'Build left untracked files'"
